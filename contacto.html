<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Datos de contacto y formulario para escribirle a Brenett Eichentopf Sanchez.">
    <title>Contacto · Hoja de vida</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
</head>
<body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <header>
        <button id="menu-toggle" class="menu-toggle" type="button" aria-expanded="false" aria-controls="nav-principal" aria-label="Abrir menú de navegación">
            <span aria-hidden="true">&#9776;</span>
        </button>
        <nav id="nav-principal" aria-label="Navegación principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="formacion.html">Formación</a></li>
                <li><a href="habilidades.html">Habilidades</a></li>
                <li><a href="experiencia.html">Experiencia</a></li>
                <li><a href="contacto.html" aria-current="page">Contacto</a></li>
            </ul>
        </nav>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar entre modo claro y oscuro" aria-pressed="false">Modo oscuro</button>
    </header>

    <main id="contenido">
        <section aria-labelledby="contacto-titulo">
            <h1 id="contacto-titulo">Contacto</h1>

            <ul class="contact-line">
                <li><a href="mailto:brenett.eichentopf@ucb.edu.bo">brenett.eichentopf@ucb.edu.bo</a></li>
                <li><a href="tel:+59162383463">+591 62383463</a></li>
                <li><a href="https://github.com/HelpyBren?tab=repositories" target="_blank" rel="noopener">GitHub</a></li>
            </ul>

            <form id="form-contacto" novalidate aria-label="Formulario de contacto">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" autocomplete="name" required aria-describedby="error-nombre">
                <p class="error-msg" id="error-nombre" aria-live="polite"></p>

                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" autocomplete="email" required aria-describedby="error-correo">
                <p class="error-msg" id="error-correo" aria-live="polite"></p>

                <label for="asunto">Asunto</label>
                <input type="text" id="asunto" name="asunto" required aria-describedby="error-asunto">
                <p class="error-msg" id="error-asunto" aria-live="polite"></p>

                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" minlength="10" required aria-describedby="error-mensaje"></textarea>
                <p class="error-msg" id="error-mensaje" aria-live="polite"></p>

                <button type="submit" class="btn btn-primary">Enviar mensaje</button>
                <p id="form-status" role="status"></p>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <ul class="social">
            <li><a href="https://github.com/HelpyBren" target="_blank" rel="noopener">GitHub</a></li>
            <li><a href="mailto:brenett.eichentopf@ucb.edu.bo">Correo</a></li>
        </ul>
        <p>&copy; 2026 Brenett Eichentopf Sanchez</p>
    </footer>
    <script src="js/menu.js"></script>
    <script src="js/validacion.js"></script>
</body>
</html>
