<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="formacion.html">Formación</a></li>

                <li><a href="experiencia.html">Experiencia</a></li>

            </ul>
        </nav>
        <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar entre modo claro y oscuro">Modo oscuro</button>
    </header>

    <main>
        <section aria-labelledby="contacto-titulo">
        <h1 id="contacto-titulo">Contacto</h1>

        <ul class="contact-line">
            <li><a href="mailto:brenett.eichentopf@ucb.edu.bo">brenett.eichentopf@ucb.edu.bo</a></li>
            <li><a href="tel:+59162383463">+591 62383463</a></li>
            <li><a href="https://github.com/HelpyBren?tab=repositories" target="_blank" rel="noopener">GitHub</a></li>
        </ul>

        <form id="form-contacto" novalidate>

            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required>
            <p class="error-msg"></p>
            

            
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" required>
            <p class="error-msg"></p>
            

            
            <label for="asunto">Asunto</label>
            <input type="text" id="asunto" name="asunto" required>
            <p class="error-msg"></p>
            

            
            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" name="mensaje" required></textarea>
            <p class="error-msg"></p>
            

            <button type="submit" class="btn btn-primary">Enviar mensaje</button>
            <p id="form-status" role="status"></p>
        </form>
        </section>
    </main>

    <footer class="site-footer">
        <ul class="social">
            <li><a href="https://github.com/HelpyBren" target="_blank" rel="noopener">GitHub</a></li>

        </ul>

    </footer>
